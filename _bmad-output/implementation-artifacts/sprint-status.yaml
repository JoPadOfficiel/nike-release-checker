        notes: "Nike injects window-level capture-phase click listener that preventDefault+stopPropagation on programmatic mouse events. Solution: bezier curve mouse movement (realism) + element.click() via evaluate (bypasses window interceptor by calling onClick directly). All 6 checkout step files updated."

